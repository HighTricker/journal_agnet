<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天的三件好事</title>
<style>
  :root{
    --bg:#e7eaf6; --card:#fff; --ink:#2b2e3c; --muted:#8c92a8; --line:#e6e9f3;
    --accent:#5560d6; --accent-soft:#eef0fb;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);font-family:var(--font);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:28px 16px}
  .card{width:100%;max-width:560px;background:var(--card);border-radius:18px;
    padding:24px 22px 18px;box-shadow:0 10px 30px rgba(54,60,110,.10)}
  .title{color:var(--accent);font-size:17px;font-weight:700;letter-spacing:.5px;margin:0}
  .hint{color:var(--muted);font-size:13px;line-height:1.55;margin:6px 0 18px}

  .rows{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:flex-start;gap:11px}
  .idx{flex:0 0 auto;width:24px;height:24px;border-radius:8px;margin-top:7px;display:flex;
    align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;
    color:var(--accent);background:var(--accent-soft)}
  .pair{flex:1;display:flex;gap:9px;min-width:0}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld.thing{flex:1.3}
  .fld.why{flex:1}
  .fld .lab{font-size:11px;color:var(--muted);padding-left:2px}
  .fld textarea{width:100%;resize:none;border:1px solid var(--line);border-radius:11px;background:#fbfbfe;
    padding:9px 10px;font-family:inherit;font-size:14px;color:var(--ink);line-height:1.5;min-height:50px;
    transition:border-color .15s,box-shadow .15s}
  .fld textarea::placeholder{color:#b7bccb}
  .fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .fld.why textarea{background:#fafbff}

  .soft{margin-top:15px;background:#f7f8fc;border-radius:12px;padding:11px 13px;
    font-size:12px;color:var(--muted);line-height:1.55}
  .soft b{color:#6f7488;font-weight:600}

  .store{margin-top:14px;border-top:1px dashed var(--line);padding-top:11px;
    font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8;word-break:break-all}
  .store b{color:var(--accent);font-weight:600}

  @media (max-width:520px){
    .pair{flex-direction:column;gap:7px}
    .fld.thing,.fld.why{flex:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="card">
    <p class="title">今天的三件好事</p>
    <p class="hint">写下今天三件顺心的小事——发生了什么都行，不一定是你做成的。右边那栏写下它为什么发生、或为什么是好的，效果最好。</p>

    <div class="rows">
      <div class="row">
        <span class="idx">1</span>
        <div class="pair">
          <div class="fld thing"><span class="lab">好事</span><textarea data-k="thing" data-i="0" placeholder="一件顺心的小事"></textarea></div>
          <div class="fld why"><span class="lab">为什么</span><textarea data-k="why" data-i="0" placeholder="它为什么发生 / 为什么是好的"></textarea></div>
        </div>
      </div>
      <div class="row">
        <span class="idx">2</span>
        <div class="pair">
          <div class="fld thing"><span class="lab">好事</span><textarea data-k="thing" data-i="1" placeholder="如：丁丁炒面意外地好吃"></textarea></div>
          <div class="fld why"><span class="lab">为什么</span><textarea data-k="why" data-i="1" placeholder="如：凉皮没开门，换一家反而踩到宝"></textarea></div>
        </div>
      </div>
      <div class="row">
        <span class="idx">3</span>
        <div class="pair">
          <div class="fld thing"><span class="lab">好事</span><textarea data-k="thing" data-i="2" placeholder="再小都算"></textarea></div>
          <div class="fld why"><span class="lab">为什么</span><textarea data-k="why" data-i="2" placeholder="它为什么发生 / 为什么是好的"></textarea></div>
        </div>
      </div>
    </div>

    <div class="soft">写不满三件也没关系，<b>一件小事也算</b>；今天很糟的话，这不是要你假装它好，只是帮你把容易被盖过去的那点好捞回来。</div>

    <div class="store">存成 &nbsp; <b>good_things</b>: <span id="val"></span></div>
  </div>

<script>
  const items = [{thing:"",why:""},{thing:"",why:""},{thing:"",why:""}];
  const val = document.getElementById("val");
  function cell(s){ return s ? `"${s}"` : "—"; }
  function draw(){
    val.innerHTML = "[ " + items.map(o =>
      `{ <b>事</b>:${cell(o.thing)}， <b>因</b>:${cell(o.why)} }`).join("， ") + " ]";
  }
  document.querySelectorAll("textarea").forEach(t => {
    t.addEventListener("input", e => {
      const { k, i } = e.target.dataset;
      items[+i][k] = e.target.value.trim();
      draw();
    });
  });
  draw();
</script>
</body>
</html>
