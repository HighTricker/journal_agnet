<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心情评分 · 五级</title>
<style>
  :root{
    --bg:#e7eaf6; --card:#fff; --ink:#2b2e3c; --muted:#8c92a8; --line:#e6e9f3;
    --accent:#5560d6; --accent-soft:#eef0fb;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);font-family:var(--font);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:28px 16px}
  .card{width:100%;max-width:480px;background:var(--card);border-radius:18px;
    padding:24px 20px 18px;box-shadow:0 10px 30px rgba(54,60,110,.10)}
  .title{color:var(--accent);font-size:17px;font-weight:700;letter-spacing:.5px;margin:0}
  .hint{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 16px}

  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    border:1px solid var(--line);background:#fbfbfe;border-radius:13px;padding:12px 13px;
    font-family:inherit;transition:border-color .15s,box-shadow .15s,background .15s}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt[aria-checked="true"]{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}

  .badge{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600;color:#6a6f84;
    background:#eef0f6}
  /* 极轻的暖↔冷价数提示，去饱和，不做红绿灯 */
  .opt[data-v="5"] .badge{background:#f3ecdc;color:#a98a4e}
  .opt[data-v="4"] .badge{background:#e9f1ec;color:#5e9079}
  .opt[data-v="3"] .badge{background:#eef0f6;color:#6a6f84}
  .opt[data-v="2"] .badge{background:#ecedf3;color:#6b7088}
  .opt[data-v="1"] .badge{background:#edeaf0;color:#7a7290}

  .body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .name{font-size:15px;font-weight:600;color:var(--ink)}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.45}

  .store{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;
    font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .store b{color:var(--accent);font-weight:600}
  .note{font-size:11.5px;color:#b1b6c6;margin-top:6px;line-height:1.5}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="card">
    <p class="title">今日心情</p>
    <p class="hint">你今天整体感觉怎么样？只看心情本身——跟你做了什么、做得好不好无关。</p>

    <div class="opts" role="radiogroup" aria-label="今日心情">
      <button class="opt" role="radio" aria-checked="false" data-v="5">
        <span class="badge">5</span>
        <span class="body"><span class="name">明亮</span><span class="desc">心里轻快、舒展，有由衷的好心情</span></span>
      </button>
      <button class="opt" role="radio" aria-checked="false" data-v="4">
        <span class="badge">4</span>
        <span class="body"><span class="name">平和</span><span class="desc">平稳里带点暖意，挺舒服，不到特别兴奋</span></span>
      </button>
      <button class="opt" role="radio" aria-checked="false" data-v="3">
        <span class="badge">3</span>
        <span class="body"><span class="name">平淡</span><span class="desc">没什么大起伏，情绪基本是平的</span></span>
      </button>
      <button class="opt" role="radio" aria-checked="false" data-v="2">
        <span class="badge">2</span>
        <span class="body"><span class="name">低落</span><span class="desc">发沉或烦躁，提不起劲，有点想躲</span></span>
      </button>
      <button class="opt" role="radio" aria-checked="false" data-v="1">
        <span class="badge">1</span>
        <span class="body"><span class="name">很糟</span><span class="desc">情绪很差，沉重、难受或发空，撑着过</span></span>
      </button>
    </div>

    <div class="store">存成 &nbsp; <b>mood_score</b>: <span id="val">—</span></div>
    <p class="note">沿用你原来的 1–5：1 最差、5 最好，历史数据不断档。</p>
  </div>

<script>
  const opts = document.querySelectorAll(".opt");
  const val = document.getElementById("val");
  let score = "";
  opts.forEach(o => {
    o.addEventListener("click", () => {
      const v = o.dataset.v;
      const on = score === v;
      score = on ? "" : v;
      opts.forEach(x => x.setAttribute("aria-checked", String(!on && x === o)));
      val.textContent = score || "—";
    });
  });
</script>
</body>
</html>
